name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes whatever was running for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # Caches the pnpm store, keyed on the lockfile.
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # One turbo run: it knows the dependency graph, so packages build before
      # the things that consume them, and unchanged packages are cached.
      - name: Verify
        run: pnpm turbo run lint typecheck test build

      - name: Check formatting
        run: pnpm format:check

      # A documented rule that nothing checks stops being true.
      - name: Check dependency boundaries
        run: pnpm check:boundaries

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm --filter @stack/template-app exec playwright install --with-deps chromium

      - name: Run
        run: pnpm turbo run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: templates/app/playwright-report/
          retention-days: 7
