<!doctype html>
<html lang="en" data-appearance="dark" data-density="comfortable">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Stack App</title>
    <!--
      Applies the stored theme before first paint, so there is no flash of the
      wrong colour scheme. It has to be a blocking classic script: a module
      script is deferred and would run after the browser has already painted.

      This mirrors `themeInitScript()` from @bwmp-dev/ui, which server-rendered
      apps can call directly instead of duplicating it here.
    -->
    <script>
      ;(function () {
        try {
          var stored = JSON.parse(localStorage.getItem('stack:theme') || '{}')
          var appearance = stored.appearance || 'system'
          if (appearance === 'system') {
            appearance = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          var root = document.documentElement
          root.setAttribute('data-appearance', appearance)
          root.setAttribute('data-density', stored.density || 'comfortable')
          if (stored.theme) root.setAttribute('data-theme', stored.theme)
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
