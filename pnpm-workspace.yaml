packages:
  - 'apps/*'
  - 'packages/*'
  - 'templates/*'
  - 'tooling/*'

allowBuilds:
  '@parcel/watcher': set this to true or false
  esbuild: true

# Single source of truth for third-party versions across every workspace package.
# Members reference these with "catalog:" instead of pinning their own ranges.
catalog:
  react: 19.2.8
  react-dom: 19.2.8
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.7

  typescript: 6.0.3
  '@types/node': ^26.4.1

  vite: 8.2.2
  '@vitejs/plugin-react': 6.1.1
  vitest: 5.0.0
  '@vitest/coverage-v8': 5.0.0
  jsdom: ^30.0.1
  '@testing-library/react': ^16.3.3
  '@testing-library/dom': ^10.4.1
  '@testing-library/user-event': ^14.6.7
  '@testing-library/jest-dom': ^7.0.1
  '@playwright/test': 1.62.1

  tailwindcss: 4.3.3
  '@tailwindcss/vite': 4.3.3
  '@tailwindcss/cli': 4.3.3

  '@base-ui/react': 1.7.0
  'lucide-react': 1.40.0
  clsx: 2.1.1
  'tailwind-merge': 3.6.0

  '@tanstack/react-router': 1.170.32
  '@tanstack/router-plugin': 1.168.35
  '@tanstack/react-query': 5.102.8
  '@tanstack/react-query-devtools': 5.102.8
  '@tanstack/react-table': 9.2.4
  '@tanstack/react-form': 1.33.5
  '@tanstack/react-start': 1.168.49
  '@tanstack/react-router-ssr-query': ^1.167.2

  zod: 4.5.4
  srvx: ^1.0.3

  eslint: 10.9.1
  'typescript-eslint': 8.69.0
  '@eslint/js': 10.0.1
  'eslint-plugin-react-hooks': ^7.1.1
  'eslint-plugin-react-refresh': ^0.5.6
  'eslint-plugin-jsx-a11y': ^6.10.2
  globals: ^17.12.0
  prettier: 3.9.6
  'prettier-plugin-tailwindcss': ^0.8.1
  'prettier-plugin-astro': ^0.14.1

  astro: 7.3.1
  '@astrojs/react': 6.0.5
  '@astrojs/mdx': ^8.0.0
  '@astrojs/sitemap': ^3.7.4
  '@astrojs/check': ^0.9.5
  shiki: ^4.4.3

minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.0'
  - '@vitest/spy@5.0.0'
  - rolldown-plugin-dts@0.28.5
  - tinyexec@1.3.1
  - tsdown@0.23.0
  - vitest@5.0.0
  - '@types/react-dom@19.2.7'
  - lucide-react@1.40.0
  - astro@7.3.1
  - srvx@1.0.3

onlyBuiltDependencies:
  - esbuild
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - sharp
